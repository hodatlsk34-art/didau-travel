name: Lấy tọa độ + ảnh điểm quốc tế

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/intl_src.py'
      - 'tools/intl_plan.py'
      - 'tools/intl_west.py'
      - 'tools/fetch_intl.py'
      - '.github/workflows/intl.yml'

permissions:
  contents: write

concurrency:
  group: intl
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/fetch_intl.py
      - name: Lưu kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/intl tools/intl_last.log
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "Cập nhật tọa độ + ảnh điểm quốc tế (tự động)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
