name: Tạo trang Blog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/blog/posts.json'
      - 'tools/build_blog.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_blog.py
      - name: Commit trang Blog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/blog public/sitemap.xml
          git diff --cached --quiet || git commit -m "Tạo lại trang Blog (tự động)"
          git push
