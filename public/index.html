<style>
/* Layout: app shell — header, left work panel (Khám phá / Lịch trình AI / Đã lưu), right real map (Leaflet + ranh giới 34 tỉnh thành) */
:root{
  --paper:#F1F3EC; --surface:#FFFFFF; --surface-2:#E6EAE0; --ink:#18241F; --muted:#5B6862; --line:#D2D8CB;
  --moss:#0E4C8E; --lacquer:#D04A1C; --gold:#B7800F; --teal:#22803A; --sun:#F28A1E; --on-accent:#FFFFFF;
  --land:#F7F8F3; --land-sel:#FFFFFF; --logo-bg:transparent; --sea:#D9E6E2; --border:#B9C4B5; --oldq:#E6DBC4;
  --font-display:"Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow:0 8px 28px rgba(16,40,34,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111916; --surface:#17211D; --surface-2:#21302A; --ink:#E6ECE6; --muted:#97A69E; --line:#2D3C36;
    --moss:#86B6F0; --lacquer:#F2805A; --gold:#E8B651; --teal:#72C784; --sun:#F7A24A; --on-accent:#0B1626;
    --land:#1A2521; --land-sel:#22312B; --logo-bg:#F3F5EE; --sea:#0F1A18; --border:#3A4C45; --oldq:#2B2A21;
    --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111916; --surface:#17211D; --surface-2:#21302A; --ink:#E6ECE6; --muted:#97A69E; --line:#2D3C36;
  --moss:#86B6F0; --lacquer:#F2805A; --gold:#E8B651; --teal:#72C784; --sun:#F7A24A; --on-accent:#0B1626;
  --land:#1A2521; --land-sel:#22312B; --logo-bg:#F3F5EE; --sea:#0F1A18; --border:#3A4C45; --oldq:#2B2A21;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--moss),var(--teal) 45%,var(--sun)) 1}
.brand{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0;text-align:left}
.brand-mark{display:flex;align-items:center;gap:6px;border-radius:12px;padding:2px 6px 2px 2px;background:var(--logo-bg)}
.brand-mark .emblem{width:44px;height:44px;display:block}
.brand-mark .word{height:34px;width:auto;display:block}
.tagline{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--moss);font-weight:600}
.prov{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:600;white-space:nowrap;max-width:60vw}
.prov span.nm{overflow:hidden;text-overflow:ellipsis}
.prov svg{width:16px;height:16px;flex:none}
.proto{font-size:12px;color:var(--muted);padding:6px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.proto strong{color:var(--ink);font-weight:600}

.main{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.tabs{display:flex;gap:4px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
/* Menu: viên tròn có biểu tượng, mỗi mục một màu lấy từ logo */
.tabs{gap:8px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:color-mix(in srgb,var(--tc) 8%,transparent);border-radius:999px;padding:9px 12px;font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink);transition:background .15s,color .15s}
.tab .ti{display:grid;place-items:center;color:var(--tc)}
.tab .ti svg{width:20px;height:20px}
.tab:hover{background:color-mix(in srgb,var(--tc) 16%,transparent)}
.tab[aria-selected="true"]{background:var(--tc);color:var(--on-accent);box-shadow:0 4px 14px color-mix(in srgb,var(--tc) 35%,transparent)}
.tab[aria-selected="true"] .ti{color:var(--on-accent)}
.tab .n{font-size:11px;font-weight:700;background:color-mix(in srgb,var(--tc) 18%,var(--surface));color:var(--tc);border-radius:999px;padding:1px 7px;font-family:var(--font-body)}
.tab[aria-selected="true"] .n{background:var(--on-accent);color:var(--tc)}
.pbody{flex:1;min-height:0;overflow:auto;padding:18px max(16px,calc((100% - 880px)/2)) 90px;display:flex;flex-direction:column;gap:14px}
.tabs{padding-left:max(10px,calc((100% - 880px)/2));padding-right:max(10px,calc((100% - 880px)/2))}

.phead{display:flex;flex-direction:column;gap:2px}
.phead h2{font-family:var(--font-display);font-size:24px;line-height:1.15}
.phead small{color:var(--muted);font-size:12.5px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;font:inherit;color:var(--ink);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--on-accent)}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--on-accent)}
.chip small{opacity:.75;font-size:12px}
.area-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.season{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--oldq)}
.season svg{width:34px;height:34px;color:var(--gold)}
.season-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.season p{font-size:13px}

.count{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pcard{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start;text-align:left;border:0;background:none;padding:11px 4px;border-bottom:1px solid var(--line);border-radius:0}
.pcard:hover{background:var(--paper)}
.pic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.pic svg{width:22px;height:22px}
.pmain{display:flex;flex-direction:column;min-width:0}
.pname{font-weight:600;font-size:15px}
.psub{font-size:12.5px;color:var(--muted)}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;margin-top:3px}
.pmeta .dot{color:var(--line)}
.tag-season{font-size:11px;font-weight:700;color:var(--gold);border:1px solid currentColor;border-radius:999px;padding:0 7px}
.tag-area{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 7px}
.heart{color:var(--lacquer);font-size:16px;line-height:1;padding-top:2px}

.back{align-self:flex-start;border:0;background:none;color:var(--muted);font-weight:600;padding:2px 0}
.hero{border-radius:16px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;
  background:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--c) 30%,transparent) 1px, transparent 1.6px) 0 0/14px 14px, color-mix(in srgb,var(--c) 12%,var(--surface))}
.hero-ic{width:56px;height:56px;border-radius:16px;background:var(--c);color:var(--surface);display:grid;place-items:center}
.hero-ic svg{width:30px;height:30px}
.cat-chip{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--c)}
.hero h2{font-family:var(--font-display);font-size:24px;line-height:1.15;margin:2px 0 6px}
.hero p{font-size:13.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.facts div{background:var(--paper);border-radius:12px;padding:10px 12px;min-width:0}
.facts dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-weight:500}
.note h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.note p{font-size:14.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--moss);color:var(--on-accent);border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14.5px;text-decoration:none}
.btn.big{width:100%;padding:14px 16px;font-size:15.5px}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;text-decoration:none}
.btn-ghost.on{color:var(--lacquer);border-color:var(--lacquer)}
.aff{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.aff h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.aff.stay{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper)}
.aff.stay h3{color:var(--ink);font-size:13px}
.photo-note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center}

/* planner */
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.date,.select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;width:100%}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:38px;height:38px;font-size:18px}
.stepper output{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.must{display:flex;flex-wrap:wrap;gap:6px}
.must .chip{background:var(--paper)}
.must .chip button{border:0;background:none;padding:0 0 0 2px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}

.loading{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;background:var(--paper)}
.loading div{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.loading div.done{color:var(--ink)}
.loading div::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.loading div.done::before{background:var(--teal)}

.plan-sum{border-radius:16px;background:var(--moss);color:var(--on-accent);padding:16px;display:flex;flex-direction:column;gap:12px}
.ai-badge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.plan-sum h3{font-family:var(--font-display);font-size:21px;line-height:1.2;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column;min-width:0}
.stats b{font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;opacity:.85}
.daytabs{display:flex;gap:6px;overflow-x:auto}
.daytab{flex:1;min-width:120px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;font-weight:600}
.daytab small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.daytab[aria-pressed="true"]{border-color:var(--lacquer);box-shadow:inset 0 0 0 1px var(--lacquer)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.leg{margin:0 0 0 62px;padding:5px 0 5px 14px;border-left:2px dashed var(--line);font-size:12px;color:var(--muted)}
.tl-row{display:grid;grid-template-columns:42px 24px minmax(0,1fr) auto;gap:8px;align-items:start;padding:4px 0}
.tl-time{font-weight:600;font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.tl-dot{width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center}
.tl-body{display:flex;flex-direction:column;min-width:0}
.tl-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tl-name{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:15px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.tl-why{font-size:12.5px;color:var(--teal)}
.tl-cost{font-size:12.5px;color:var(--muted)}
.swap{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.fine{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.section-h{font-family:var(--font-display);font-size:18px}
.saved-plan{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.saved-plan small{display:block;color:var(--muted)}

/* map */
.mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--sea)}
/* Bản đồ 3 trạng thái: ẩn · nhỏ nhúng trong nội dung · mở rộng (ngăn kéo/toàn màn hình) */
.mapwrap.off{position:fixed;left:-9999px;top:0;width:600px;height:400px;visibility:hidden}
.minihost{display:block}
.mapwrap.mini{height:320px;border-radius:16px;border:1px solid var(--line)}
.mapwrap.overlay{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);z-index:1500;box-shadow:-10px 0 40px rgba(0,0,0,.25);border-left:1px solid var(--line)}
.mapctl .ov-only,.mapctl .mini-only{display:none}
.mapwrap.overlay .mapctl .ov-only,.mapwrap.mini .mapctl .mini-only{display:inline-block}
.mapwrap.mini .mapctl .full-only,.mapwrap.mini .legend,.mapwrap.mini .tilenote{display:none!important}
.mapctl .ov-only,.mapctl .mini-only{background:#0E4C8E!important;color:#fff!important;border-color:#0E4C8E!important}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:1400;border:2px solid #fff;border-radius:999px;background:#0E4C8E;color:#fff;padding:12px 18px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(14,76,142,.4)}
.fab:hover{filter:brightness(1.08)}
.map-scrim{position:fixed;inset:0;background:rgba(10,20,16,.35);z-index:1450}
@media (min-width:900px){ .plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px} }
#map{position:absolute;inset:0}
.leaflet-container{background:var(--sea);font-family:var(--font-body)}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--muted)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--teal)!important}
path.prov{fill:var(--land);fill-opacity:1;stroke:var(--border);stroke-width:1}
path.prov.sel{fill:var(--land-sel);stroke:var(--moss);stroke-width:2}
.has-tiles path.prov{fill-opacity:0;stroke-opacity:.35}
.has-tiles path.prov.sel{fill:var(--moss);fill-opacity:.05;stroke-opacity:1}
path.prov:hover{stroke:var(--moss)}
path.mk{stroke:var(--surface);stroke-width:1.6;fill-opacity:1}
path.mk-food{fill:var(--lacquer)} path.mk-check{fill:var(--gold)} path.mk-sight{fill:var(--teal)}
path.mk.faint{fill-opacity:.35;stroke-opacity:.5}
path.mk.selring{fill:none;stroke-width:2.5;stroke-opacity:.7}
path.mk.selring.mk-food{stroke:var(--lacquer)} path.mk.selring.mk-check{stroke:var(--gold)} path.mk.selring.mk-sight{stroke:var(--teal)}
path.route{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:6 5;fill:none;stroke-opacity:.75}
path.island{fill:var(--moss);stroke:var(--surface);stroke-width:1}
.num-ic{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:var(--surface);font-weight:700;font-size:12px;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.num-ic.food{background:var(--lacquer)} .num-ic.check{background:var(--gold)} .num-ic.sight{background:var(--teal)}
.plabel{font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;text-align:center;pointer-events:none;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.plabel.sel{color:var(--moss);font-size:12.5px}
.ilabel{font-family:var(--font-display);font-style:italic;font-size:12.5px;color:var(--moss);white-space:nowrap;pointer-events:none;text-shadow:0 0 3px var(--sea),0 0 3px var(--sea)}
.mapwrap:not(.far) .plabel{display:none}
.mapwrap.vfar .plabel:not(.sel):not(.city){display:none}
.leaflet-tooltip.tip{background:var(--ink);color:var(--paper);border:0;border-radius:8px;font-weight:600;font-size:12.5px;padding:4px 9px;box-shadow:var(--shadow)}
.leaflet-tooltip.tip::before{border-top-color:var(--ink)}
.mapctl{position:absolute;top:12px;left:12px;z-index:500;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 64px)}
.mapctl button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
.route-box{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper)}
.route-box h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.route-res{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.route-res b{font-size:22px;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.route-res span{color:var(--muted);font-size:13px}
.dist-tag{font-size:11.5px;font-weight:700;color:var(--teal)}
path.myroute{stroke:var(--teal);stroke-width:5;stroke-opacity:.85;fill:none;stroke-linecap:round;stroke-linejoin:round}
path.myroute.est{stroke-dasharray:2 9}
path.me{fill:#2F7DE1;stroke:#fff;stroke-width:3;fill-opacity:1}
path.me-acc{fill:#2F7DE1;fill-opacity:.12;stroke:#2F7DE1;stroke-opacity:.35;stroke-width:1}
.pickbar{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;z-index:600;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.pickbar button{border:0;background:var(--paper);color:var(--ink);border-radius:8px;padding:4px 10px;font-weight:600}
.mapwrap.picking #map{cursor:crosshair}
.mapctl button[aria-pressed="true"]{background:var(--moss);color:var(--on-accent);border-color:var(--moss)}
.legend{position:absolute;left:12px;bottom:12px;z-index:500;display:flex;gap:10px;flex-wrap:wrap;background:var(--surface);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tilenote{position:absolute;left:12px;top:52px;z-index:500;max-width:min(340px,calc(100% - 24px));background:var(--surface);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:12px;color:var(--muted)}
.tilenote b{color:var(--ink)}

/* sheet & toast */
.sheet{position:fixed;inset:0;background:rgba(10,20,16,.45);display:grid;place-items:center;padding:16px;z-index:2000}
.sheet-card{width:min(600px,100%);max-height:min(82vh,760px);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--font-display);font-size:20px}
.sheet-head button{border:0;background:var(--surface-2);border-radius:999px;width:32px;height:32px;font-size:16px}
.sheet-body{overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.pgroup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.plist2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pitem{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.pitem b{font-weight:600}
.pitem small{font-size:11.5px;color:var(--muted)}
.pitem .badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--teal)}
.pitem.cur{border-color:var(--moss);box-shadow:inset 0 0 0 1px var(--moss)}
.hit{font-size:11.5px;color:var(--lacquer)}
.intro{align-items:center;text-align:center;gap:14px;padding:22px 20px 20px}
.intro .full{width:min(260px,62vw);height:auto;border-radius:20px;background:var(--logo-bg);padding:6px}
.intro h3{font-family:var(--font-display);font-size:21px}
.intro ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left;width:100%;max-width:380px}
.intro li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:14px}
.intro li b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--moss);font-size:14px}
textarea.copy{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.5 var(--font-body);background:var(--paper);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);z-index:3000;max-width:calc(100% - 32px)}

/* V2: trang chủ, gợi ý điểm đến, lịch trình chi tiết */
.home-hero{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--moss) 13%,var(--surface)),color-mix(in srgb,var(--sun) 15%,var(--surface)))}
.home-hero h1{font-family:var(--font-display);font-size:30px;line-height:1.1}
.home-hero .sub{color:var(--muted);font-size:13.5px}
.ask{display:flex;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden}
.ask:focus-within{border-color:var(--moss)}
.ask textarea{flex:1;border:0;resize:vertical;min-height:70px;padding:12px;font:15px/1.45 var(--font-body);background:transparent;color:var(--ink);outline:none}
.examples{display:flex;flex-wrap:wrap;gap:6px}
.ex{border:1px dashed var(--border);background:transparent;border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--muted);text-align:left}
.ex:hover{color:var(--ink);border-style:solid}
.parsed{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;gap:5px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.pchip.miss{color:var(--muted);font-weight:500;border-style:dashed}
.cta2{border:0;background:none;color:var(--moss);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
details.more{border:1px solid var(--line);border-radius:14px;padding:0 12px;background:var(--surface)}
details.more>summary{cursor:pointer;padding:11px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'▾';color:var(--muted)}
details.more[open]>summary::after{content:'▴'}
details.more>div{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{display:flex;flex-direction:column;gap:4px;min-width:0}
.mini>span{font-size:11.5px;color:var(--muted);font-weight:600}
.stepper.sm button{width:30px;height:34px;font-size:16px}
.money{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}
.money input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;font:inherit;color:var(--ink);outline:none}
.money span{color:var(--muted);font-size:13px}
.rec{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.rec.best{border-color:var(--moss);box-shadow:inset 0 0 0 1px var(--moss)}
.rec-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rec-h h3{font-family:var(--font-display);font-size:22px;line-height:1.15}
.rec-h small{display:block;color:var(--muted);font-size:12.5px}
.match{flex:none;text-align:center;border-radius:12px;background:var(--moss);color:var(--on-accent);padding:6px 10px;font-weight:700;font-size:19px;line-height:1.1}
.match small{display:block;font-size:10.5px;font-weight:600;opacity:.85}
.rec ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.rec li.w{color:var(--lacquer)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpis div{background:var(--paper);border-radius:10px;padding:7px 9px;min-width:0}
.kpis b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums}
.kpis span{font-size:11px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;align-self:flex-start}
.pill.ok{background:color-mix(in srgb,var(--teal) 20%,var(--surface));color:var(--teal)}
.pill.bad{background:color-mix(in srgb,var(--lacquer) 20%,var(--surface));color:var(--lacquer)}
.plan-sum .pill{background:var(--surface)}
.opt-note{font-size:12.5px;opacity:.9}
.warns{display:flex;flex-direction:column;gap:6px}
.wbox{border-radius:12px;padding:10px 12px;font-size:13px;background:color-mix(in srgb,var(--sun) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--sun) 45%,transparent)}
.wbox ul{margin:4px 0 0;padding-left:18px}
.wbox.rain{background:color-mix(in srgb,#2F7DE1 11%,var(--surface));border-color:color-mix(in srgb,#2F7DE1 40%,transparent)}
.wbox.good{background:color-mix(in srgb,var(--teal) 11%,var(--surface));border-color:color-mix(in srgb,var(--teal) 40%,transparent)}
.wbox .actions{margin-top:8px}
.tl-meta{font-size:12px;color:var(--muted)}
.tl-ctl{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tl-ctl .row{display:flex;gap:3px}
.ic-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:28px;height:26px;font-size:13px;color:var(--muted);padding:0}
.ic-btn:disabled{opacity:.3;cursor:default}
.free{margin:0 0 0 62px;padding:3px 0 3px 14px;border-left:2px dashed var(--line);font-size:12px;color:var(--teal)}
.startpt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.startpt b{color:var(--ink)}
.budget{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.budget table{width:100%;border-collapse:collapse;font-size:13.5px}
.budget td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.budget td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;padding-left:10px}
.budget td small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.budget tr.total td{border-bottom:0;font-size:15.5px;font-weight:700}
.daytab .wx{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.feat{display:flex;flex-direction:column;gap:8px}
.mk-dest{display:grid;place-items:center;min-width:28px;height:28px;padding:0 7px;border-radius:999px;background:var(--moss);color:var(--on-accent);font-weight:700;font-size:12.5px;border:2px solid var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.3);white-space:nowrap}
.mk-dest.dim{background:var(--gold);min-width:14px;height:14px;padding:0}

/* ---------- Liên kết đối tác (affiliate) ----------

const AFF = {
  agodaCid: '',     // mã "Site ID" (cid) do Agoda Partners cấp, ví dụ '1234567'
  bookingAid: '',   // mã "aid" do Booking.com Affiliate Partner Program cấp
  // Đăng ký qua mạng trung gian (AccessTrade, Ecomobi…): mỗi nhãn hàng một mẫu deep link, {url} là chỗ chèn link gốc.
  wrap: {
    agoda:'', booking:'', klook:'',
    // Ecomobi – chiến dịch Traveloka Việt Nam (advertiser_id=traveloka.com.vn)
    traveloka:'https://goeco.mobi/?token=jAAsklqtdBozRAjUNkPga&url={url}&sub1=didau-app&sub2=web&sub3={sub3}&advertiser_id=traveloka.com.vn&global_domain=traveloka.com'
  }
};
/* Mã thành phố Agoda (city ID). Chỉ ghi mã đã kiểm chứng; điểm đến chưa có mã sẽ dùng Booking.com.
   Cách lấy mã: tìm thành phố trên agoda.com, xem tham số city=... trên thanh địa chỉ, hoặc dùng công cụ tạo link trong trang Agoda Partners. */
const AGODA_CITY = {
  'TP. Hồ Chí Minh':13170, 'Trung tâm Sài Gòn':13170,
  'Đà Nẵng':16440, 'Trung tâm Đà Nẵng':16440
};
function agodaUrl(keys,checkin,nights,adults){
  if(!AFF.agodaCid && !AFF.wrap.agoda) return null;
  const k=keys.find(x=>AGODA_CITY[x]); if(!k) return null;
  const q=checkin?'&checkIn='+checkin+'&los='+Math.max(1,nights)+'&adults='+(adults||2)+'&rooms=1':'';
  if(AFF.agodaCid) return 'https://www.agoda.com/partners/partnersearch.aspx?pcs=1&cid='+encodeURIComponent(AFF.agodaCid)+'&hl=vi-vn&city='+AGODA_CITY[k]+q;
  return affWrap('agoda','https://www.agoda.com/vi-vn/search?city='+AGODA_CITY[k]+q);
}
const slugTag = s => norm(s||'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
let affTag='';  // tên tỉnh/điểm đến của lượt bấm, ghi vào sub3 để xem báo cáo theo tỉnh
const affWrap = (m,url) => AFF.wrap[m] ? AFF.wrap[m].replace('{url}',encodeURIComponent(url)).replace('{sub3}',encodeURIComponent(affTag||'chung')) : url;
const monetized = m => !!(AFF.wrap[m] || (m==='booking'&&AFF.bookingAid) || (m==='agoda'&&AFF.agodaCid));
const travelokaHotelUrl = () => affWrap('traveloka','https://www.traveloka.com/vi-vn/hotel');
const travelokaActUrl = () => affWrap('traveloka','https://www.traveloka.com/vi-vn/activities');
function hotelLinks(keys,q,checkin,nights,adults){
  affTag=slugTag(q);
  const out=[]; const ag=agodaUrl(keys,checkin,nights,adults);
  if(ag) out.push({label:'Khách sạn trên Agoda',href:ag});
  if(monetized('traveloka')) out.push({label:'Khách sạn trên Traveloka',href:travelokaHotelUrl()});
  if(monetized('booking')||!out.length) out.push({label:out.length?'So sánh trên Booking':'Khách sạn quanh '+q,href:bookingUrl(q,checkin,nights,adults)});
  return out;
}
function activityLinks(q){
  affTag=slugTag(q); const out=[];
  if(monetized('klook')||!monetized('traveloka')) out.push({label:'Vé, tour trên Klook',href:klookUrl(q)});
  if(monetized('traveloka')) out.push({label:'Vé, tour trên Traveloka',href:travelokaActUrl()});
  return out;
}
const linkBtns = (arr,firstCls) => arr.map((l,i)=>`<a class="${i===0&&firstCls?firstCls:'btn-ghost'}" href="${l.href}" target="_blank" rel="noopener sponsored">${esc(l.label)} ↗</a>`).join('');
function bookingUrl(q,checkin,nights,adults){
  let u='https://www.booking.com/searchresults.vi.html?ss='+encodeURIComponent(q+', Việt Nam');

function hav(a,b){const R=6371,r=Math.PI/180;const dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
const roadKm = (a,b) => hav(a,b)*1.3;
const fmtKm = km => (km<10?km.toFixed(1):Math.round(km).toString()).replace('.',',')+' km';

/* ---------- V2: làm giàu dữ liệu địa điểm ----------
   Thời lượng, trong nhà/ngoài trời, độ phù hợp trẻ em/người lớn tuổi được SUY RA theo quy tắc từ tên và loại địa điểm (ước tính).
   p.src: nguồn; p.ver: ngày xác minh tại chỗ. Chưa xác minh thì để null, không tự điền. */
function ioOf(p){
  if(p.cat==='food') return p.kinds.includes('evening')||p.kinds.includes('vat')?'mixed':'in';
  const n=p.name.toLowerCase();
  if(/bảo tàng|nhà hát|hải dương học|dinh |dinh thự|nhà tù|nhà cổ|hầm |chung cư|bưu điện|^động |văn miếu|đại nội|chợ lớn|ga đà lạt|làng tranh/.test(n)) return 'in';
  if(/bãi|biển|vịnh|đảo|đèo|đồi|thác|^hồ|hồ |núi|mũi|gành|ghềnh|eo gió|ruộng|thung lũng|rừng|suối|^cầu|phố đi bộ|quảng trường|công viên|bến |làng chài|cánh đồng|cột |cao nguyên|kỳ co|cổng tò vò|đỉnh|pù luông|tràng an|tam cốc|sông|chợ nổi|vườn|^bản |hang múa|hòn|tượng|vòng quay|bà nà|fansipan|ải chi lăng|cồn |tràm chim|lăng cô|hang rái/.test(n)) return 'out';
  return 'mixed';
}
function durOf(p){
  const n=p.name.toLowerCase();
  if(p.cat==='food') return p.tags.includes('cafe')||p.kinds.includes('cafe')?60:p.kinds.includes('toi')?75:p.kinds.includes('trua')?60:p.kinds.includes('sang')?45:40;
  if(/vịnh|bà nà|fansipan|vườn quốc gia|kỳ co|tràng an|yên tử|sông nho quế|hồ na hang|lan hạ|cù lao|đảo|cát tiên|hồ ba bể|chợ nổi|mỹ sơn|tam cốc/.test(n)) return 180;
  if(/đại nội|bảo tàng|phố cổ|dinh|lăng|nhà tù|thành |bản |chợ phiên|di tích|thánh địa|địa đạo|^động /.test(n)) return p.cost>=100000?120:90;
  return p.cat==='sight'?75:45;
}
function fitOf(p){
  const n=p.name.toLowerCase();
  const hard=/đèo|đỉnh|cột cờ|mã pì lèng|ô quy hồ|khau phạ|hang múa|kỳ co|trekking|leo núi/.test(n);
  const steps=/yên tử|bạch mã|thác|đồi cát|sông nho quế|pù luông|đảo bé|eo gió|hang rái|núi |mẫu sơn|fansipan|ngũ hành sơn|bà đen/.test(n);
  return {kid:!hard, old:!hard&&!steps};
}
const BEACH_RX=/bãi|biển|vịnh|đảo|mũi|gành|ghềnh|kỳ co|eo gió|hòn|làng chài|cầu tàu/, NAT_RX=/thác|hồ|rừng|núi|đèo|vườn|ruộng|hang|đồi|suối|thung lũng|cao nguyên|pù luông|tràng an|tam cốc|sông|cánh đồng|^bản |tràm chim|cồn |^động /;
ALL.forEach(p=>{
  p.dur=p.dur||durOf(p); p.io=p.io||ioOf(p); p.fit=p.fit||fitOf(p);
  const n=p.name.toLowerCase();
  if(p.cat!=='food'){ if(BEACH_RX.test(n)) p.tags.push('beach'); if(NAT_RX.test(n)) p.tags.push('nature'); if(p.tags.includes('beach')||/hồ |suối|đồi chè|thiền viện/.test(n)) p.tags.push('relax'); }

});

const nearestAir=pt=>AIRPORTS.reduce((a,b)=>hav(a,pt)<=hav(b,pt)?a:b);
function travelFor(origin,dest){
  const oc=ORIGIN[origin]; if(!oc||!dest) return null;
  const O={lat:oc[0],lng:oc[1]}, dkm=hav(O,dest);
  if(dkm<15) return {mode:'local',h:0.3,pp:0,text:'Ngay tại '+origin};
  const rk=dkm*1.3, rh=rk/45+0.3;
  let best=dest.noRoad?null:{mode:'road',h:rh,pp:2*Math.max(80000,rk*800)+(dest.ferry||0),text:(rk<160?'Ô tô/xe khách':'Xe khách giường nằm')+' ~'+fmtH(rh)+' mỗi chiều'+(dest.ferry?', gồm tàu/phà':'')};
  const oa=nearestAir(O), da=nearestAir(dest), g1=hav(O,oa)*1.3, g2=hav(da,dest)*1.3, fk=hav(oa,da);
  if(oa!==da && fk>(dest.noRoad?100:200) && (oa.hub||da.hub) && g1<160 && g2<200){
    const h=g1/40+1.6+fk/700+0.4+g2/40;
    const fly={mode:'fly',h,pp:2*(650000+fk*550+Math.max(60000,(g1+g2)*900))+(dest.flyX||0),text:'Máy bay '+oa.name+' → '+da.name+(g2>30?' + ô tô':'')+', ~'+fmtH(h)+' cửa tới cửa'};
    if(!best || fly.pp+fly.h*2*60000 < best.pp+best.h*2*60000) best=fly;
  }
  return best;
}

/* ---------- Lập lịch trình (mô phỏng AI) ---------- */
function kmeans(pts,k){
  if(!pts.length) return [];
  k=Math.min(k,pts.length);
  const cen=[{lat:pts[0].lat,lng:pts[0].lng}];
  while(cen.length<k){let best=null,bd=-1;for(const p of pts){const d=Math.min(...cen.map(c=>hav(c,p)));if(d>bd){bd=d;best=p;}}cen.push({lat:best.lat,lng:best.lng});}
  for(let it=0;it<12;it++){
    const sum=cen.map(()=>({lat:0,lng:0,n:0}));
    pts.forEach(p=>{let bi=0,bd=Infinity;cen.forEach((c,i)=>{const d=hav(c,p);if(d<bd){bd=d;bi=i;}});sum[bi].lat+=p.lat;sum[bi].lng+=p.lng;sum[bi].n++;});
    sum.forEach((s,i)=>{if(s.n){cen[i].lat=s.lat/s.n;cen[i].lng=s.lng/s.n;}});
  }
  return cen;
}
function zonesFor(o,pool){
  const pre=PRESET_ZONES[o.prov+'|'+o.area]; if(pre) return pre;
  if(o.area==='all'){
    const cnt=a=>pool.filter(p=>p.area===a).length;
    const cent=a=>{const ps=pool.filter(p=>p.area===a&&p.cat!=='food'); const src=ps.length?ps:pool.filter(p=>p.area===a);
      return {lat:src.reduce((s,p)=>s+p.lat,0)/src.length,lng:src.reduce((s,p)=>s+p.lng,0)/src.length};};
    const all=[...DATA[o.prov].areas].sort((a,b)=>cnt(b)-cnt(a));
    let big=all.filter(a=>cnt(a)>=3); if(!big.length) big=all.slice(0,1);
    const zones=big.map(a=>({area:a,areas:[a],name:a==='Nội thành'?o.prov:a,...cent(a)}));
    all.filter(a=>!big.includes(a)).forEach(a=>{const c=cent(a); const z=zones.reduce((x,y)=>hav(x,c)<=hav(y,c)?x:y); z.areas.push(a); z.name+=' + '+a;});
    return zones;
  }
  const anchors=pool.filter(p=>p.cat!=='food');
  const cen=kmeans(anchors.length?anchors:pool,o.days);
  return cen.map(c=>{const near=(anchors.length?anchors:pool).reduce((a,b)=>hav(a,c)<=hav(b,c)?a:b);return {lat:c.lat,lng:c.lng,name:'Quanh '+near.name};});
}
const nearestZone=(p,zones)=>{if(zones[0]&&zones[0].areas){const i=zones.findIndex(z=>z.areas.includes(p.area));if(i>=0)return i;} let bi=0,bd=Infinity;zones.forEach((z,i)=>{const d=hav(z,p);if(d<bd){bd=d;bi=i;}});return bi;};
function fits(p,slot,wd,hour,budget){
  if(!slot.kinds.some(k=>p.kinds.includes(k))) return false;
  if(p.closed && p.closed.includes(wd)) return false;
  if(p.morningOnly && hour>=11) return false;
  if(slot.sunset && !p.sunset) return false;
  if(slot.evening && p.cat!=='food' && p.evening==='weekend' && ![5,6,0].includes(wd)) return false;
  if(p.cat==='food' && p.cost>BUDGET[budget].max) return false;
  return true;
}
function scorePlace(p,slot,ctx,o){
  let sc=0;
  if(state.must.has(p.id)) sc+=30;
  if(ctx.zoneOf[p.id]===ctx.zi) sc+=6; else sc-=0.8*Math.min(hav(p,ctx.zones[ctx.zi]),25);
  if(ctx.prev) sc-=2.2*Math.min(hav(ctx.prev,p),8);
  const hits=[...o.interests].filter(i=>p.tags.includes(INTEREST[i].tag));
  sc+=3*hits.length;
  if(p.season) sc+=2;
  if(p.tags.includes('classic')) sc+=1.5;
  if(slot.sunset && p.sunset) sc+=8;
  if(slot.evening && p.kinds.includes('evening')) sc+=6;
  if(!slot.evening && p.evening) sc-=5;
  if(p.morningOnly && parseInt(slot.t,10)<9) sc+=5;
  if(p.premium) sc+= o.budget==='thoaimai'?3:-2;
  if(p.cat==='food' && o.budget==='tietkiem') sc+=(60000-p.cost)/30000;
  if(slot.kinds.includes('cafe') && p.tags.includes('cafe')) sc+=3;
  if(ctx.today && ctx.today.has(p.id)) sc-=50;
  if(o.kd && !p.fit.kid) sc-=8;
  if(o.el && !p.fit.old) sc-=8;
  if(ctx.rain){ if(p.io==='out') sc-=14; else if(p.io==='in') sc+=4; }
  if(o.cheap && p.cat!=='food' && p.cost>150000 && !state.must.has(p.id)) sc-=p.cost/100000;
  let reason;
  if(state.must.has(p.id)) reason='Bạn đã chọn ghé điểm này';
  else if(slot.sunset && p.sunset) reason='Đúng giờ hoàng hôn';
  else if(slot.evening && p.kinds.includes('evening')) reason=p.evening==='weekend'?'Mở tối cuối tuần':'Đẹp nhất buổi tối';
  else if(p.morningOnly) reason='Chỉ đẹp vào sáng sớm';
  else if(p.season) reason=p.season;
  else if(ctx.prev && hav(ctx.prev,p)<0.45) reason='Chỉ cách điểm trước ~'+Math.max(100,Math.round(roadKm(ctx.prev,p)*1000/50)*50)+' m';
  else if(hits.length && (p.cat!=='food' || hits.length>1)) reason='Hợp sở thích: '+hits.map(i=>INTEREST[i].label.toLowerCase()).join(', ');

}
function pickOnce(slot,ctx,o,exclude,budget,reuseFood){
  const hour=parseInt(slot.t,10); let best=null;
  const za=ctx.zones[ctx.zi]&&ctx.zones[ctx.zi].areas;
  for(const p of ctx.pool){
    if(za && !za.includes(p.area)) continue;
    if(ctx.noOut && p.cat!=='food' && p.io==='out') continue;
    const blocked=exclude.has(p.id) && !(reuseFood && p.cat==='food' && !(ctx.today&&ctx.today.has(p.id)));
    if(blocked || !fits(p,slot,ctx.wd,hour,budget)) continue;
    const r=scorePlace(p,slot,ctx,o);

}
const MEAL_ALT={sang:['vat','cafe'],trua:['toi','vat'],toi:['trua','vat']};
const pick1=(slot,ctx,o,ex)=>pickOnce(slot,ctx,o,ex,o.budget,false)||pickOnce(slot,ctx,o,ex,'thoaimai',false)||pickOnce(slot,ctx,o,ex,'thoaimai',true);

function planCtx(plan){
  const o=plan.opts, pool=ALL.filter(p=>p.prov===o.prov&&(o.area==='all'||p.area===o.area));

  return {pool,zones,zoneOf};

function makePlan(o){

  const used=new Set(), slots=PACE[opts.pace].slots;
  for(let d=0; d<opts.days; d++){
    const date=addDays(opts.start,d), wd=date.getDay(), zi=d%Math.max(1,base.zones.length);
    const stops=[], today=new Set(); let prev=null;
    slots.forEach((slot,si)=>{
      const b=pick(slot,{...base,zi,wd,prev,today},opts,used); if(!b) return;
      used.add(b.p.id); today.add(b.p.id);
      stops.push({t:slot.t,label:slot.label,slot,si,id:b.p.id,reason:b.reason,tried:[b.p.id]}); prev=b.p;
    });
    plan.days.push({date,wd,zi,stops});
  }
  let saved=0; plan.days.forEach((d,k)=>{const r=optimizeOrder(plan,k,true); saved+=r.cur-r.best;}); plan.optSaved=saved;
  return plan;

const MODE_TX={walk:'🚶 Đi bộ',bike:'🛵 Xe máy/Grab bike',car:'🚗 Ô tô/Grab car',hire:'🚐 Thuê xe'};
function legInfo(a,b,P){

  if(km<1.2){mode='walk';min=Math.max(3,km/4.5*60);cost=0;}
  else if(km<40){ if(P<=2){mode='bike';min=km/22*60+5;cost=P*(12000+4500*km);} else {mode='car';min=km/25*60+6;cost=Math.ceil(P/4)*(20000+11000*km);} }
  else {mode='hire';min=km/45*60+10;cost=Math.ceil(P/6)*(150000+9000*km);}
  return {km,min:Math.round(min),cost:Math.round(cost/1000)*1000,mode};
}
const zoneLabel=z=>String(z.name).replace(/^Quanh /,'gần ');
const hotelCache={};

  const c={lat:src.reduce((s,p)=>s+p.lat,0)/src.length,lng:src.reduce((s,p)=>s+p.lng,0)/src.length};

function dayStart(plan,k){

const MEAL=['sang','trua','toi'];
const isFixed=s=>{const sl=s.slot||{}; return !!sl.t&&(sl.sunset||sl.evening||(sl.kinds||[]).some(x=>MEAL.includes(x)));};
function dayTimeline(plan,k){
  const o=plan.opts, d=plan.days[k], P=o.ad+o.kd+o.el, st=dayStart(plan,k); let prev=st, end=0; const items=[];
  d.stops.forEach((s,i)=>{
    const p=byId(s.id), leg=legInfo(prev,p,P), sl=s.slot||{};
    let start,arrive;
    if(i===0){ start=sl.t?toMin(sl.t):480; arrive=start; }
    else { arrive=end+leg.min; start=isFixed(s)?Math.max(arrive,toMin(sl.t)):arrive; }
    end=start+p.dur; items.push({s,p,leg,arrive,start,end,gap:start-arrive}); prev=p;
  });

}
const pathKm=pts=>{let km=0;for(let i=1;i<pts.length;i++)km+=roadKm(pts[i-1],pts[i]);return km;};
function permutations(a){ if(a.length<=1) return [a]; const r=[]; a.forEach((x,i)=>permutations([...a.slice(0,i),...a.slice(i+1)]).forEach(p=>r.push([x,...p]))); return r; }

function dayWarnings(plan,k,tl){

  if((o.kd||o.el)&&it.length>7) W.push('Đi cùng '+(o.kd?'trẻ nhỏ':'người lớn tuổi')+': ngày này có '+it.length+' điểm, nên chọn nhịp độ thong thả.');
  it.forEach((x,i)=>{
    if(i>0&&x.leg.km>25) W.push('Chặng '+it[i-1].p.name+' → '+x.p.name+' dài ~'+fmtKm(x.leg.km)+' ('+fmtMin(x.leg.min)+').');
    if(x.p.closed&&x.p.closed.includes(d.wd)) W.push(x.p.name+' thường đóng cửa vào '+WD[d.wd]+'.');
    if(x.p.morningOnly&&x.start>=11*60) W.push(x.p.name+' nên đi buổi sáng nhưng đang xếp lúc '+hhmm(x.start)+'.');
    if(o.kd&&!x.p.fit.kid) W.push(x.p.name+': đường đi/hoạt động có thể vất vả với trẻ nhỏ.');
    if(o.el&&!x.p.fit.old) W.push(x.p.name+': nhiều dốc hoặc bậc thang, cân nhắc với người lớn tuổi.');

function tripBudget(plan,tierOverride){

  const D0=destOf(o.prov,planAreaOf(plan,0)), tr=o.origin?travelFor(o.origin,D0):null;

}

/* ---------- V2: chọn điểm đến (Recommendation Engine) ----------
   Điểm phù hợp = sở thích 40 + ngân sách 25 + mùa 15 + quãng đường so với số ngày 12 + người đi cùng 8, trừ điểm khi dữ liệu còn mỏng. */
function fitBudgetTier(plan,req){
  let b=tripBudget(plan);
  if(req.total){ for(const t of ['tm','vua','tk']){ b=tripBudget(plan,t); if(b.total<=req.total*(t==='tm'?0.85:1)) break; } plan.opts.tier=b.tier; }
  return b;
}
function scoreDest(D,req,b){
  const R=[],W=[], month=new Date(req.start+'T00:00:00').getMonth()+1, ints=[...req.interests].filter(i=>INTEREST[i]);
  const ps=ALL.filter(p=>p.prov===D.prov&&p.area===D.area);
  let si=27;
  if(ints.length){ let s=0; const hit=[];
    ints.forEach(i=>{ const I=INTEREST[i]; let m=0;
      if(I.v&&[...I.v].some(c=>D.v.includes(c))) m=1; else { const share=ps.filter(p=>p.tags.includes(I.tag)).length/ps.length; m=Math.min(1,share*2.5); }
      s+=m; if(m>=0.6) hit.push(I.label.toLowerCase()); });
    si=40*s/ints.length; if(hit.length) R.push('Hợp sở thích: '+hit.join(', ')+'.'); }
  let sb=18;
  if(req.total){ const ratio=b.total/req.total; sb=ratio<=0.9?25:ratio<=1?22:ratio<=1.15?12:Math.max(0,12-(ratio-1.15)*40);
    if(ratio<=1) R.push('Dự kiến '+fmtM(b.total)+', vừa ngân sách '+fmtM(req.total)+(b.tier!=='vua'?' (khách sạn '+HOTEL_LV[b.tier].label.toLowerCase()+')':'')+'.'); else W.push('Vượt ngân sách khoảng '+fmtM(b.total-req.total)+'.'); }
  const good=D.months.includes(month);
  const storm=/[bd]/.test(D.v)&&((D.r==='btb'&&[8,9,10,11].includes(month))||(D.r==='trung'&&[9,10,11,12].includes(month)));
  let ss=good?15:7;
  if(storm){ ss=2; W.push('Tháng '+month+' là mùa mưa bão ven biển miền Trung, biển dễ động.'); } else if(good) R.push('Tháng '+month+' là thời điểm đẹp để đi.');
  let se=12; const tr=b.tr;
  if(tr){ se=12*Math.max(0,1-tr.h*2/(req.days*9)); if(req.near) se-=Math.min(10,tr.h*1.5);
    if(tr.mode!=='local') R.push('Từ '+req.origin+': '+tr.text+'.');
    if(req.days<=2&&tr.h>5) W.push('Đi lại mất khoảng '+fmtH(tr.h)+' mỗi chiều, hơi xa cho '+req.days+' ngày.'); }
  let sc=6;
  if(req.kd){ sc=D.kid*4; if(D.kid>=2) R.push('Phù hợp gia đình có trẻ nhỏ.'); }
  if(req.el){ sc=Math.min(sc,D.old*4); if(D.old<1) W.push('Địa hình đồi núi, vất vả với người lớn tuổi.'); }
  if(!req.kd&&!req.el&&req.with==='couple'&&/[bmr]/.test(D.v)){ sc=8; R.push('Lãng mạn, hợp cặp đôi.'); }
  if(req.with==='friends'&&/[abn]/.test(D.v)) sc=8;
  const cap=D.n/(req.days*5); const sd=cap>=1?0:-(1-cap)*10;
  if(cap<0.7) W.push('Kho dữ liệu nơi này mới có '+D.n+' địa điểm, lịch trình '+req.days+' ngày sẽ hơi thưa.');
  const total=si+sb+ss+Math.max(0,se)+sc+sd;
  return {pct:Math.max(30,Math.min(98,Math.round(total))),R,W,si};
}
function recommend(req,excludeKey){
  const oc=ORIGIN[req.origin], O=oc&&{lat:oc[0],lng:oc[1]};
  const res=DEST.filter(D=>D.n>=5&&D.key!==excludeKey&&!(O&&hav(O,D)<15)).map(D=>{
    const plan=makePlan(reqToOpts(req,D)), b=fitBudgetTier(plan,req), sc=scoreDest(D,req,b);
    plan.match=sc.pct; return {D,plan,b,...sc};
  });
  res.sort((a,b)=>b.pct-a.pct||b.si-a.si||a.b.total-b.b.total);
  const out=[],seen=new Set();
  for(const x of res){ if(seen.has(x.D.prov)) continue; seen.add(x.D.prov); out.push(x); if(out.length===3) break; }
  return out;
}
function planForReq(req){
  const D=DESTMAP[req.dest]; const plan=makePlan(reqToOpts(req,D)), b=fitBudgetTier(plan,req);
  plan.match=scoreDest(D,req,b).pct; return plan;
}

const imgMem={}, imgStore=load('didau.img2',{});
function destImg(key){
  if(imgStore[key]) return Promise.resolve(imgStore[key]);
  if(imgMem[key]) return imgMem[key];
  const D=DESTMAP[key]; if(!D) return Promise.resolve(null);
  const cands=[...(DIMG[key]||[]).map(t=>['en',t]),['vi',D.name.replace(/^TP /,'')]];
  return imgMem[key]=(async()=>{
    for(const [lang,t] of cands){
      try{
        const r=await fetch('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t)); if(!r.ok) continue;
        const j=await r.json(); const src=j.thumbnail&&j.thumbnail.source; if(!src||/\.svg/i.test(src)) continue;
        const m=src.match(/\/wikipedia\/([a-z]+)\/thumb\/[0-9a-f]\/[0-9a-f]{2}\/([^/]+)\//);
        const page=m?(m[1]==='commons'?'https://commons.wikimedia.org/wiki/File:':'https://'+m[1]+'.wikipedia.org/wiki/File:')+m[2]:((j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||'https://commons.wikimedia.org');
        const res={src,big:m?src.replace(/\/\d+px-/,'/640px-'):src,page};
        imgStore[key]=res; store('didau.img2',imgStore); return res;
      }catch(e){}
    }
    return null;
  })();
}
function applyImgs(){
  document.querySelectorAll('[data-img]:not([data-done])').forEach(el=>{ el.dataset.done=1;

      const img=document.createElement('img'); img.className='wimg'; img.alt=''; img.loading='lazy'; img.decoding='async';
      img.onerror=()=>{ if(img.src!==im.src) img.src=im.src; else img.remove(); };
      img.onload=()=>el.classList.add('has-img'); img.src=im.big;
      const a=document.createElement('a'); a.className='wcredit'; a.href=im.page; a.target='_blank'; a.rel='noopener'; a.textContent='Ảnh: Wikimedia';
      el.prepend(img); el.appendChild(a);

}
/* ---------- Thống kê truy cập (GoatCounter) ----------
   GC_CODE: mã trang GoatCounter (vd 'didau' nếu trang là didau.goatcounter.com). Để trống thì ẩn ô thống kê.
   Cần bật "Allow adding visitor counts on your website" trong Settings của GoatCounter. */
const GC_CODE='didau';
const GC_BASE=GC_CODE?'https://'+GC_CODE+'.goatcounter.com':'';
let gcStats=null;
function gcRanges(){
  const d=new Date(), iso=x=>isoD(x), t=iso(d), y=new Date(d); y.setDate(d.getDate()-1);
  const w=new Date(d); w.setDate(d.getDate()-6); const m=new Date(d.getFullYear(),d.getMonth(),1);
  return [['today','Hôm nay',t,t],['yday','Hôm qua',iso(y),iso(y)],['week','7 ngày qua',iso(w),t],['month','Tháng này',iso(m),t],['total','Tổng lượt truy cập',null,null]];
}
async function loadStats(){

  await Promise.all(gcRanges().map(async([k,,a,b])=>{
    try{ const r=await fetch(GC_BASE+'/counter/TOTAL.json'+(a?'?start='+a+'&end='+b:''));
      if(!r.ok) return; const j=await r.json(); gcStats[k]={n:num(j.count),u:num(j.count_unique)}; }catch(e){}
  }));
  const el=$('#siteStats'); if(el) el.outerHTML=statsHTML();

async function fetchRoute(from,to,mode){
  const key=[from.lat.toFixed(4),from.lng.toFixed(4),to.id,mode].join('|'); if(routeCache[key]) return routeCache[key];
  for(const base of ROUTERS[mode]){
    try{
      const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(base+from.lng+','+from.lat+';'+to.lng+','+to.lat+'?overview=full&geometries=geojson',{signal:ctl.signal}); clearTimeout(t);
      if(!r.ok) continue; const j=await r.json(); if(j.code!=='Ok'||!j.routes||!j.routes.length) continue;
      const rt=j.routes[0], km=rt.distance/1000;
      let min=rt.duration/60; if(mode==='car') min=Math.max(min, km/30*60); // xe máy trong đô thị ~30 km/h
      return routeCache[key]={km,min,coords:rt.geometry.coordinates.map(c=>[c[1],c[0]])};
    }catch(e){}
  }
  return null;
}

let routeLayer, meLayer;
let map, provLayer, tileLayer, placeLayer, labelLayer, tileErrs=0, tileOk=false, tileIdx=0;
const OSM_ATTR='© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
const TILE_PROVIDERS=[
  {name:'OpenStreetMap',url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',opt:{maxZoom:19,attribution:OSM_ATTR}},
  {name:'OSM Humanitarian',url:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',opt:{subdomains:'abc',maxZoom:19,attribution:OSM_ATTR+', nền <a href="https://www.hotosm.org/" target="_blank" rel="noopener">HOT</a> / OSM France'}}
];
function makeTileLayer(i){
  tileIdx=i; tileErrs=0; tileOk=false;
  const pr=TILE_PROVIDERS[i];
  tileLayer=L.tileLayer(pr.url,{...pr.opt,referrerPolicy:'strict-origin-when-cross-origin',crossOrigin:false});
  tileLayer.on('tileload',()=>{tileOk=true;});
  tileLayer.on('tileerror',()=>{ tileErrs++;
    if(tileErrs>=4 && !tileOk){
      const wasOn=map.hasLayer(tileLayer); if(wasOn) map.removeLayer(tileLayer);
      if(tileIdx+1<TILE_PROVIDERS.length){ makeTileLayer(tileIdx+1); if(wasOn) enableTiles(); }
      else { makeTileLayer(0); disableTiles(true); }
    }});
}
const provPaths={};

  }).addTo(map);

  L.marker([9.55,113.0],{icon:L.divIcon({className:'ilabel',html:'Quần đảo Trường Sa<br>(tỉnh Khánh Hòa)',iconSize:[150,32],iconAnchor:[75,0]}),interactive:false}).addTo(iso);
  labelLayer=L.layerGroup().addTo(map);
  GEO.features.forEach(f=>{const disp=GEO2DISP[f.properties.name];
    L.marker([f.properties.lat,f.properties.lng],{icon:L.divIcon({className:'plabel'+(PROVMAP[disp].t==='tp'?' city':''),html:esc(disp),iconSize:[120,16],iconAnchor:[60,8]}),interactive:false,keyboard:false}).addTo(labelLayer);});
  routeLayer=L.layerGroup().addTo(map);
  placeLayer=L.layerGroup().addTo(map);
  meLayer=L.layerGroup().addTo(map);
  map.on('click',e=>{ if(state.pickMode) setMe(e.latlng.lat,e.latlng.lng,'manual',0); });
  map.on('zoomend',()=>{const z=map.getZoom(),w=$('#mapwrap');w.classList.toggle('far',z<8);w.classList.toggle('vfar',z<6);});
  if(load('didau.tiles',true)) enableTiles(); else $('#btnTiles').setAttribute('aria-pressed','false');
}
function enableTiles(){ tileErrs=0; tileLayer.addTo(map); tileLayer.bringToBack(); $('#mapwrap').classList.add('has-tiles'); $('#btnTiles').setAttribute('aria-pressed','true'); $('#tilenote').hidden=true; }
function disableTiles(blocked){
  if(map.hasLayer(tileLayer)) map.removeLayer(tileLayer);
  $('#mapwrap').classList.remove('has-tiles'); $('#btnTiles').setAttribute('aria-pressed','false');
  if(blocked){ state.tiles='blocked';
    const n=$('#tilenote'); n.hidden=false;
    const inFrame=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
    n.innerHTML=inFrame?'<b>Lớp bản đồ đường phố chưa tải được ở đây.</b> Khung xem trước chặn ảnh bản đồ từ máy chủ ngoài. Mở trang trên web thật để thấy bản đồ đường phố. Ranh giới tỉnh và tọa độ địa điểm vẫn chính xác.'
      :'<b>Không tải được ảnh bản đồ đường phố.</b> Máy chủ OpenStreetMap không phản hồi cho trình duyệt này. Thử mở <a href="https://tile.openstreetmap.org/5/25/14.png" target="_blank" rel="noopener">ảnh bản đồ mẫu</a>: nếu thấy chữ "Access blocked" hoặc trang trắng thì mạng/trình duyệt đang chặn. Ranh giới tỉnh và địa điểm vẫn chính xác.';
    setTimeout(()=>{n.hidden=true;},20000);
  }
}
function markProv(){
  Object.entries(provPaths).forEach(([n,l])=>{const el=l.getElement&&l.getElement(); if(el) el.classList.toggle('sel',n===state.prov);});
  labelLayer.eachLayer(m=>{const el=m.getElement&&m.getElement(); if(el) el.classList.toggle('sel',el.textContent===state.prov);});
}
function visibleItems(){
  if(state.tab==='plan' && state.plan && !state.loading && state.plan.opts.prov===state.prov){
    const day=state.plan.days[state.day];
    return {route:day.stops.map(s=>byId(s.id)),start:dayStart(state.plan,state.day),others:provPlaces().filter(p=>!day.stops.some(s=>s.id===p.id))};
  }
  if(state.tab==='saved') {const s=ALL.filter(p=>state.saved.has(p.id));return {route:null,main:s,others:provPlaces().filter(p=>!state.saved.has(p.id))};}
  const main=filtered(); return {route:null,main,others:provPlaces().filter(p=>!main.includes(p))};
}
function renderMap(){
  if(!map) return;
  markProv(); placeLayer.clearLayers(); drawRoute(false);
  if(state.tab==='home'&&!state.selected){ homeMap(); return; }
  const vi=visibleItems(), sel=state.selected?byId(state.selected):null;
  const add=(p,r,cls)=>{const m=L.circleMarker([p.lat,p.lng],{radius:r,className:'mk mk-'+p.cat+(cls?' '+cls:''),bubblingMouseEvents:false});
    m.bindTooltip(esc(p.name),{direction:'top',offset:[0,-r],className:'tip'}); m.on('click',()=>openPlace(p.id)); m.addTo(placeLayer); return m;};
  vi.others.forEach(p=>add(p,4,'faint'));
  if(vi.route){
    const line=(vi.start&&!vi.start.me?[vi.start]:vi.start?[vi.start]:[]).concat(vi.route);
    if(line.length>1) L.polyline(line.map(p=>[p.lat,p.lng]),{className:'route',interactive:false}).addTo(placeLayer);
    if(vi.start&&!vi.start.me) L.marker([vi.start.lat,vi.start.lng],{icon:L.divIcon({className:'',html:'<span class="num-ic sight" style="background:var(--moss)">🏨</span>',iconSize:[24,24],iconAnchor:[12,12]}),interactive:true}).bindTooltip('Xuất phát: '+esc(vi.start.label),{direction:'top',offset:[0,-12],className:'tip'}).addTo(placeLayer);
    vi.route.forEach((p,i)=>{const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<span class="num-ic ${p.cat}">${i+1}</span>`,iconSize:[24,24],iconAnchor:[12,12]}),riseOnHover:true});
      m.bindTooltip(esc(p.name),{direction:'top',offset:[0,-12],className:'tip'}); m.on('click',()=>openPlace(p.id)); m.addTo(placeLayer);});
  } else vi.main.forEach(p=>add(p,sel&&sel.id===p.id?10:7));
  if(sel){
    L.circleMarker([sel.lat,sel.lng],{radius:17,className:'mk selring mk-'+sel.cat,interactive:false}).addTo(placeLayer);
    const t=L.tooltip({permanent:true,direction:'top',offset:[0,-16],className:'tip'}).setLatLng([sel.lat,sel.lng]).setContent(esc(sel.name)); placeLayer.addLayer(t);
  }
}
function homeMap(){
  const H=state.home, r=H.req||buildReq(), oc=ORIGIN[r.origin];
  if(H.recs&&H.recs.length){
    H.recs.forEach((x,i)=>{ L.marker([x.D.lat,x.D.lng],{icon:L.divIcon({className:'',html:`<span class="mk-dest">${i+1} · ${esc(x.D.name)} ${x.pct}%</span>`,iconSize:null,iconAnchor:[14,14]}),riseOnHover:true})
      .on('click',()=>openRecPlan(i)).addTo(placeLayer); });
    if(oc) L.circleMarker(oc,{radius:7,className:'me',interactive:true}).bindTooltip('Xuất phát: '+esc(r.origin),{direction:'top',className:'tip'}).addTo(placeLayer);
    return;
  }
  const mo=new Date().getMonth()+1;
  DEST.filter(D=>D.n>=5).forEach(D=>{ const good=D.months.includes(mo);
    L.marker([D.lat,D.lng],{icon:L.divIcon({className:'',html:`<span class="mk-dest dim" style="${good?'':'background:var(--muted);opacity:.6'}"></span>`,iconSize:[14,14],iconAnchor:[7,7]})})
      .bindTooltip(esc(destName(D))+(good?' · đẹp tháng '+mo:''),{direction:'top',className:'tip'}).on('click',()=>pickDest(D.key)).addTo(placeLayer); });
}
function pickDest(key){ const H=state.home; H.manual.dest=key; buildReq(); if(state.tab!=='home'){state.tab='home';state.selected=null;} H.recs=null; render(); toast('Điểm đến: '+destName(DESTMAP[key])+'. Bấm "Tạo lịch trình".'); }
function openRecPlan(i){ const x=state.home.recs[i]; if(!x) return; applyPlan(x.plan); render(); fitView(); }
function fitPlaces(places,maxZoom=15){
  if(!map||!places.length) return;
  if(places.length===1){map.setView([places[0].lat,places[0].lng],Math.min(maxZoom,14));return;}
  map.fitBounds(L.latLngBounds(places.map(p=>[p.lat,p.lng])),{padding:[50,50],maxZoom});
}
function fitProv(){ const l=provPaths[state.prov]; if(l) map.fitBounds(l.getBounds(),{padding:[20,20]}); }
function fitView(){
  if(!map||mapMode==='off') return;
  if(state.tab==='home'&&!state.selected){ const H=state.home, oc=H.req&&ORIGIN[H.req.origin];
    if(H.recs&&H.recs.length){ const pts=H.recs.map(x=>[x.D.lat,x.D.lng]); if(oc) pts.push(oc); map.fitBounds(L.latLngBounds(pts),{padding:[60,60],maxZoom:9}); }
    else map.fitBounds([[8.3,102.1],[23.4,114.6]],{padding:[10,10]}); return; }
  if(state.tab==='plan'&&state.plan&&state.plan.opts.prov===state.prov) fitPlaces(state.plan.days[state.day].stops.map(s=>byId(s.id)));
  else if(state.tab==='explore'&&state.area!=='all') fitPlaces(filtered());
  else if(state.prov==='Hà Nội'&&state.tab==='explore') fitPlaces(provPlaces());
  else fitProv();
}

/* ---------- Tỉnh thành ---------- */
function selectProv(name){
  state.prov=name; state.area='all'; state.q=''; state.filter='all'; state.selected=null;
  state.opts.prov=name; state.opts.area=DATA[name].areas.length>1?'all':DATA[name].areas[0]; state.must.clear(); state.day=0;
  state.plan=makePlan(state.opts);
  if(state.tab==='saved'||state.tab==='home') state.tab='explore';
  render(); fitView(); toast('Đang xem '+name+'.');
}
function provHTML(q){
  const nq=norm(q.trim());
  const txt=pr=>norm(pr.n+' '+(pr.old||'')+' '+(pr.hot||'')+' '+DATA[pr.n].areas.join(' '));
  const m=pr=>!nq||txt(pr).includes(nq);
  const hitNote=pr=>{if(!nq) return ''; const src=((pr.old||'')+', '+(pr.hot||'')+', '+DATA[pr.n].areas.join(', ')).split(',').map(x=>x.trim()).filter(Boolean); const h=src.find(x=>norm(x).includes(nq)&&norm(x)!==norm(pr.n)); return h?`<span class="hit">${esc(h)} → thuộc ${esc(pr.n)}</span>`:'';};
  const item=pr=>`<button class="pitem ${pr.n===state.prov?'cur':''}" data-prov="${esc(pr.n)}"><span class="badge">${DATA[pr.n].places.length} địa điểm</span><b>${esc(pr.n)}</b>${pr.old?`<small>Gồm: ${esc(pr.old)}</small>`:''}${pr.hot?`<small>${esc(pr.hot)}</small>`:''}${hitNote(pr)}</button>`;
  const tp=PROV.filter(p=>p.t==='tp'&&m(p)), tinh=PROV.filter(p=>p.t==='tinh'&&m(p)).sort((a,b)=>a.n.localeCompare(b.n,'vi'));
  return `${tp.length?`<div class="pgroup">6 thành phố</div><div class="plist2">${tp.map(item).join('')}</div>`:''}
    ${tinh.length?`<div class="pgroup">28 tỉnh</div><div class="plist2">${tinh.map(item).join('')}</div>`:''}
    ${!tp.length&&!tinh.length?'<div class="empty"><b>Không tìm thấy</b>Thử tên tỉnh cũ hoặc điểm đến, ví dụ "Hội An", "Sa Pa".</div>':''}`;
}

function openPlace(id){
  if(state.mapOpen){ state.mapOpen=false; }
  const p=byId(id);
  if(!state.selected) state.from=state.tab;
  if(p.prov!==state.prov){state.prov=p.prov;state.area='all';}
  state.selected=id; state.rmode=null; render(); window.scrollTo(0,0);
  if(state.me) requestRoute();
  if(map){ if(map.getZoom()<12) map.setView([p.lat,p.lng],14); else map.panTo([p.lat,p.lng]); }
}

  state.loading=true; state.day=0; state.undo=null; state.prevPlan=null; render();
  const steps=[...document.querySelectorAll('#loading div')]; let k=0;
  const tick=()=>{ if(k<steps.length){steps[k].classList.add('done');k++;setTimeout(tick,220);} else {
    state.plan=makePlan(state.opts); state.loading=false; render(); fitView(); } };
  setTimeout(tick,160);
}
function setPlanOpt(k,v){ state.opts[k]=v; if(state.plan) state.plan.opts[k]=v; render(); }
function moveStop(i,dir){
  const d=state.plan.days[state.day], j=i+dir; if(j<0||j>=d.stops.length) return;
  state.undo={k:state.day,stops:d.stops.map(s=>({...s}))}; [d.stops[i],d.stops[j]]=[d.stops[j],d.stops[i]]; render();
}
function removeStop(i){
  const d=state.plan.days[state.day], s=d.stops[i]; state.undo={k:state.day,stops:d.stops.map(x=>({...x}))};
  d.stops.splice(i,1); state.must.delete(s.id); render(); toast('Đã bỏ '+byId(s.id).name+'. Bấm "Hoàn tác" nếu muốn lấy lại.');
}
function addToPlan(p){
  const plan=state.plan, o=plan&&plan.opts;
  if(!plan||o.prov!==p.prov||(o.area!=='all'&&o.area!==p.area)) return false;
  const k0=plan.days.findIndex(d=>d.stops.some(s=>s.id===p.id)); if(k0>=0){ state.day=k0; toast(p.name+' đã có trong Ngày '+(k0+1)+'.'); return true; }
  let k=state.day; if(o.area==='all'){ const zi=plan.zones.findIndex(z=>z.areas&&z.areas.includes(p.area)); const kk=plan.days.findIndex(d=>d.zi===zi); if(kk>=0) k=kk; }
  const d=plan.days[k], st=dayStart(plan,k), pts=[st,...d.stops.map(s=>byId(s.id))]; let best=pts.length-1, bk=Infinity;
  for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[i+1]; const add=roadKm(a,p)+(b?roadKm(p,b)-roadKm(a,b):0); if(add<bk){bk=add;best=i;} }
  state.undo={k,stops:d.stops.map(s=>({...s}))};
  d.stops.splice(best,0,{id:p.id,si:-1,slot:{kinds:p.kinds,label:CAT[p.cat].label},label:CAT[p.cat].label,reason:'Bạn chọn thêm',tried:[p.id]});
  state.day=k; toast('Đã thêm '+p.name+' vào Ngày '+(k+1)+', ở vị trí ít phải đi vòng nhất.'); return true;
}
function cheaper(){
  const plan=state.plan, o=plan.opts, before=tripBudget(plan).total;
  const o2={...o,interests:new Set(o.interests),cheap:true,budget:'tietkiem',tier:o.tier==='tm'?'vua':'tk',pace:o.pace==='day'?'vua':o.pace};
  const p2=makePlan(o2); p2.match=plan.match; const after=tripBudget(p2).total;
  if(after>=before-20000){ const bb=tripBudget(plan); const big=bb.arrive>bb.total*0.35?'vé đi lại tới nơi ('+fmtM(bb.arrive)+')':bb.hotel>bb.total*0.35?'khách sạn ('+fmtM(bb.hotel)+')':'';
    toast('Lịch trình đã ở mức tiết kiệm nhất với dữ liệu hiện có.'+(big?' Khoản lớn nhất là '+big+': thử bớt ngày hoặc chọn điểm đến gần hơn.':'')); return; }
  state.prevPlan=plan; state.plan=p2; state.opts=normOpts({...o2,interests:new Set(o2.interests)}); state.undo=null;
  p2.note='Đã giảm khoảng '+fmtM(before-after)+' ('+fmtM(before)+' → '+fmtM(after)+'): hạ mức khách sạn, ưu tiên quán bình dân và điểm miễn phí, bớt vé đắt.';
  render(); fitView();
}
function savePlan(){
  const pl=state.plan, rec={title:planTitle(pl.opts),at:new Date().toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}),...serPlan(pl,true)};
  state.plans.unshift(rec); state.plans=state.plans.slice(0,20); store('didau.plans',state.plans); render(); toast('Đã lưu vào "Chuyến đi của tôi" (tab Đã lưu).');
}
function loadSaved(k){
  const pl=state.plans[k]; if(!pl) return;
  let plan;
  if(pl.v===2) plan=deserPlan(pl);
  else { const o=normOpts({...pl.opts,interests:new Set(pl.opts.interests)});
    plan={opts:o,zones:pl.zones,days:pl.days.map(dd=>({date:new Date(dd.date),wd:dd.wd,zi:dd.zi,stops:dd.stops.map(s=>{const si=PACE[o.pace].slots.findIndex(x=>x.t===s.t);return {...s,si,slot:PACE[o.pace].slots[Math.max(0,si)],tried:[s.id]};})}))}; }
  if(!plan){ toast('Không mở được chuyến đi này.'); return; }
  applyPlan(plan); render(); fitView();
}
function sharePlan(){
  const url=shareUrl(state.plan), title='Đi Đâu? · '+planTitle(state.plan.opts);
  if(navigator.share){ navigator.share({title,url}).catch(()=>{}); return; }
  try{ navigator.clipboard.writeText(url).then(()=>toast('Đã sao chép link chia sẻ. Ai mở link sẽ thấy đúng lịch trình này.'),()=>openCopy(url,'Link chia sẻ')); }catch(e){ openCopy(url,'Link chia sẻ'); }
}
function printPlan(){
  const plan=state.plan, o=plan.opts, b=tripBudget(plan);
  let h=`<h1>Đi Đâu? · ${esc(planTitle(o))}</h1><p>Khởi hành ${dm(plan.days[0].date)}/${plan.days[0].date.getFullYear()}${o.origin?' từ '+esc(o.origin):''} · Dự kiến ${fmtM(b.total)} cho ${o.people} người</p>`;
  plan.days.forEach((d,k)=>{ const tl=dayTimeline(plan,k), w=plan.wx&&plan.wx[k];
    h+=`<h2>Ngày ${k+1} – ${WD[d.wd]} ${dm(d.date)} · ${esc(plan.zones[d.zi].name)}${w?' · '+wxLine(w):''}</h2><table>`+tl.items.map(x=>`<tr><td style="width:52pt"><b>${hhmm(x.start)}</b></td><td><b>${esc(x.p.name)}</b> · ${esc(x.s.label)}<br>${esc(x.p.addr)}<br><small>~${fmtMin(x.p.dur)} · ${x.p.cost?fmtVnd(x.p.cost)+'/người':'Miễn phí'} · ${esc(x.p.hours||'')}</small></td><td style="width:120pt"><small>${esc(MODE_TX[x.leg.mode])} ${fmtKm(x.leg.km)}, ~${fmtMin(x.leg.min)}</small></td></tr>`).join('')+'</table>'; });
  h+=`<h2>Ngân sách dự kiến</h2><table><tr><td>Di chuyển</td><td>${fmtM(b.move)}</td></tr><tr><td>Khách sạn (${b.nights} đêm, ${b.rooms} phòng)</td><td>${fmtM(b.hotel)}</td></tr><tr><td>Ăn uống</td><td>${fmtM(b.food)}</td></tr><tr><td>Vé tham quan</td><td>${fmtM(b.tix)}</td></tr><tr><td>Khác</td><td>${fmtM(b.other)}</td></tr><tr><td><b>Tổng</b></td><td><b>${fmtM(b.total)}</b></td></tr></table>
    <p><small>Lập bằng Đi Đâu? – AI Travel Planner Việt Nam. Giá và giờ mở cửa là ước tính, chưa xác minh tại chỗ.</small></p>`;
  $('#printArea').innerHTML=h;
  try{ window.print(); }catch(e){ toast('Trình duyệt chặn lệnh in ở đây. Hãy mở trang trên web để in hoặc lưu PDF.'); }
}
document.querySelector('.tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  state.tab=t.dataset.tab; state.selected=null; state.mapOpen=false; render(); fitView(); window.scrollTo(0,0);
});
$('#pbody').addEventListener('input',e=>{
  if(e.target.id==='q'){state.q=e.target.value;updateList();renderMap();return;}
  if(e.target.id==='ask'){ state.home.text=e.target.value; state.home.manual={}; refreshHomeBits(); if(!state.home.recs) renderMap(); }
});
$('#pbody').addEventListener('change',e=>{
  const t=e.target, H=state.home;
  if(t.id==='startDate'&&t.value) state.opts.start=t.value;
  if(t.id==='planArea'){state.opts.area=t.value;state.must.clear();generate();}
  if(t.classList.contains('js-total')) setPlanOpt('total',Math.max(0,Math.round(parseFloat(String(t.value).replace(',','.'))*1e6)||0));
  if(t.classList.contains('js-origin')) setPlanOpt('origin',t.value);
  if(t.id==='rqDest'){ H.manual.dest=t.value||null; refreshHomeBits(false); }
  if(t.id==='rqStart'&&t.value){ H.manual.start=t.value; refreshHomeBits(false); }
  if(t.id==='rqTotal'){ H.manual.total=Math.max(0,Math.round(parseFloat(String(t.value).replace(',','.'))*1e6)||0); refreshHomeBits(false); }
  if(t.id==='rqOrigin'){ H.manual.origin=t.value; refreshHomeBits(false); }
});
$('#pbody').addEventListener('toggle',e=>{ if(e.target.id==='reqMore') state.home.open=e.target.open; },true);
$('#pbody').addEventListener('click',e=>{
  const el=e.target.closest('button,a'); if(!el) return;
  const d=el.dataset, H=state.home;
  if(d.open){openPlace(d.open);return;}
  // Trang chủ
  if(d.ex){ H.text=EXAMPLES[Number(d.ex)]; H.manual={}; H.recs=null; buildReq(); render(); return; }
  if(d.rstep){ const [k,dv]=d.rstep.split(':'); const r=H.req, lim={days:[1,MAX_DAYS],ad:[1,12],kd:[0,8],el:[0,6]}[k]; H.manual[k]=Math.min(lim[1],Math.max(lim[0],r[k]+Number(dv))); refreshHomeBits(); return; }
  if(d.rint){ const s=new Set(H.req.interests); s.has(d.rint)?s.delete(d.rint):s.add(d.rint); H.manual.interests=[...s]; refreshHomeBits(); return; }
  if(d.rpace){ H.manual.pace=d.rpace; refreshHomeBits(); return; }
  if(d.feat){ pickDest(d.feat); return; }
  if(d.dexp){ const D=DESTMAP[d.dexp]; if(!D) return; state.prov=D.prov; state.area=D.area; state.filter='all'; state.q=''; state.tab='explore'; state.selected=null; render(); fitView(); $('#pbody').scrollTop=0; window.scrollTo(0,0); return; }
  if(d.dplan){ H.manual.dest=d.dplan; homeGo(); return; }
  if(d.recplan){ openRecPlan(Number(d.recplan)); return; }
  if(d.recexplore){ const x=H.recs[Number(d.recexplore)]; state.prov=x.D.prov; state.area=x.D.area; state.filter='all'; state.q=''; state.tab='explore'; render(); fitView(); return; }
  // Khám phá
  if(d.area){state.area=d.area;render();fitView();return;}
  if(d.rmode){state.rmode=d.rmode;requestRoute();refreshRouteUI();return;}
  if(d.filter){state.filter=d.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter)));updateList();renderMap();return;}
  // Lập lịch trình
  if(d.opt){state.opts[d.opt]=d.val;render();return;}
  if(d.tier){setPlanOpt('tier',d.tier);return;}
  if(d.int){const s=state.opts.interests;s.has(d.int)?s.delete(d.int):s.add(d.int);render();return;}
  if(d.ndays){state.opts.days=Math.min(MAX_DAYS,Math.max(1,state.opts.days+Number(d.ndays)));render();return;}
  if(d.pp){const [k,dv]=d.pp.split(':'); const lim={ad:[1,12],kd:[0,8],el:[0,6]}[k]; state.opts[k]=Math.min(lim[1],Math.max(lim[0],state.opts[k]+Number(dv))); normOpts(state.opts); render(); return;}
  if(d.unmust){state.must.delete(d.unmust);render();return;}
  if(d.day){state.day=Number(d.day);render();fitView();return;}
  if(d.swap){swapStop(Number(d.swap));return;}
  if(d.mv){const [i,dv]=d.mv.split(':').map(Number); moveStop(i,dv); return;}
  if(d.rm){removeStop(Number(d.rm)); return;}
  if(d.rain){rainReplan(Number(d.rain)); return;}
  if(d.loadplan){loadSaved(Number(d.loadplan)); return;}
  if(d.delplan){state.plans.splice(Number(d.delplan),1); store('didau.plans',state.plans); render(); toast('Đã xóa chuyến đi.'); return;}
  const a=d.action; if(!a) return;
  if(a==='homego'){homeGo();return;}
  if(a==='provsheet'){openProv();return;}
  if(a==='homeexplore'){ const r=buildReq(), D=r.dest&&DESTMAP[r.dest]; if(D){ state.prov=D.prov; state.area=D.area; } else state.area='all'; state.filter='all'; state.q=''; state.tab='explore'; render(); fitView(); window.scrollTo(0,0); return; }
  if(a==='alldest'){ H.allDest=!H.allDest; render(); return; }
  if(a==='homepick'){ H.manual.dest=null; runRecommend(); return; }
  if(a==='locate'){locate();return;}
  if(a==='pick'){setPick(true);toast('Bấm lên bản đồ để chọn điểm xuất phát.');return;}
  if(a==='sortnear'){state.sortNear=!state.sortNear;render();return;}
  if(a==='back'){state.selected=null;state.tab=state.from;render();fitView();}
  else if(a==='save'){const id=state.selected;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);store('didau.saved',[...state.saved]);render();toast(state.saved.has(id)?'Đã lưu vào danh sách.':'Đã bỏ lưu.');}
  else if(a==='addplan'){const p=byId(state.selected);
    if(addToPlan(p)){ state.selected=null; state.tab='plan'; render(); fitView(); return; }
    if(state.opts.prov!==p.prov||state.opts.area!==p.area){state.opts.prov=p.prov;state.opts.area=p.area;state.must.clear();}
    state.must.add(p.id);state.selected=null;state.tab='plan';render();fitView();toast('Đã thêm '+p.name+'. Bấm "Lập lịch trình" để sắp xếp.');}
  else if(a==='gen'){generate();}
  else if(a==='optday'){ const r=optimizeOrder(state.plan,state.day,false); if(r.cur-r.best<0.05){toast('Thứ tự ngày này đã tối ưu.');return;} state.undo={k:state.day,stops:state.plan.days[state.day].stops.map(s=>({...s}))}; optimizeOrder(state.plan,state.day,true); render(); toast('Đã sắp lại, bớt ~'+fmtKm(r.cur-r.best)+' đi lại.'); }
  else if(a==='undo'){ const u=state.undo; if(!u) return; const d0=state.plan.days[u.k]; if(u.all) state.plan.days.forEach((dd,j)=>dd.stops=u.all[j]); else d0.stops=u.stops; if(u.note) d0.rainNote=u.note; else delete d0.rainNote; state.undo=null; render(); }
  else if(a==='startme'){ if(!state.me){ toast('Hãy bấm "📍 Vị trí của tôi" trên bản đồ hoặc chọn điểm xuất phát trước.'); setPick(true); state.opts.startMode='me'; if(state.plan) state.plan.opts.startMode='me'; return; } setPlanOpt('startMode','me'); }
  else if(a==='starthotel'){ setPlanOpt('startMode','hotel'); }
  else if(a==='cheaper'){cheaper();}
  else if(a==='prevplan'){ if(state.prevPlan){ state.plan=state.prevPlan; state.prevPlan=null; state.opts=normOpts({...state.plan.opts,interests:new Set(state.plan.opts.interests)}); render(); fitView(); } }
  else if(a==='similar'){ const o=state.plan.opts; H.text=''; H.manual={days:o.days,ad:o.ad,kd:o.kd,el:o.el,total:o.total,origin:o.origin||'Hà Nội',start:o.start,interests:[...o.interests],pace:o.pace,dest:null}; runRecommend(o.area==='all'?null:o.prov+'|'+o.area); }
  else if(a==='share'){sharePlan();}
  else if(a==='print'){printPlan();}
  else if(a==='copyplan'){const txt=planText(state.plan);
    try{navigator.clipboard.writeText(txt).then(()=>toast('Đã sao chép lịch trình.'),()=>openCopy(txt));}catch(err){openCopy(txt);}}
  else if(a==='saveplan'){savePlan();}
});

else { $('#map').innerHTML='<div class="empty" style="margin:16px">Không tải được thư viện bản đồ. Kiểm tra kết nối mạng rồi tải lại trang.</div>'; }
function loadHash(){
  const m=location.hash.match(/^#trip=([A-Za-z0-9_-]+)/); if(!m) return false;
  try{ const plan=deserPlan(JSON.parse(b64d(m[1]))); if(plan){ applyPlan(plan); toast('Đã mở lịch trình được chia sẻ.'); return true; } }catch(e){}
  toast('Link chia sẻ không hợp lệ hoặc đã cũ.'); return false;
}
