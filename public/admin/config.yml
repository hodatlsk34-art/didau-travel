# Cấu hình trang quản trị /admin (Sveltia CMS). Danh sách điểm đến tạo từ public/images/credits.json.
backend:
  name: github
  repo: hodatlsk34-art/didau-travel
  branch: main
  commit_messages:
    create: 'Blog: thêm bài "{{slug}}"'
    update: 'Blog: sửa bài "{{slug}}"'
    delete: 'Blog: xóa bài "{{slug}}"'
    uploadMedia: 'Ảnh: tải lên "{{path}}"'
    deleteMedia: 'Ảnh: xóa "{{path}}"'
site_url: https://didautravel.id.vn
display_url: https://didautravel.id.vn
logo_url: /icons/icon-192.png
media_folder: public/images/uploads
public_folder: /images/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: blog
  label: Bài viết Blog
  label_singular: bài viết
  description: Mỗi bài lưu thành một file. Bấm Save (Lưu) là bài được đưa lên GitHub; khoảng 2–3 phút sau bài tự xuất hiện trên didautravel.id.vn.
  folder: content/blog
  create: true
  delete: true
  extension: md
  format: frontmatter
  slug: '{{title}}'
  summary: '{{title}} · {{date}}'
  sortable_fields:
  - date
  - title
  preview_path: blog/{{slug}}/
  fields:
  - label: Tiêu đề
    name: title
    widget: string
    hint: Nên chứa cụm từ người ta hay gõ trên Google, ví dụ "Phú Quốc 4 ngày 3 đêm tự túc". Tiêu đề cũng thành địa chỉ bài (không dấu) khi tạo bài.
  - label: Ngày đăng
    name: date
    widget: datetime
    time_format: false
    format: YYYY-MM-DD
    date_format: DD/MM/YYYY
    default: '{{now}}'
  - label: Tác giả
    name: author
    widget: string
    default: Đi Đâu?
    required: false
  - label: Điểm đến (ảnh bìa + nút "Lên lịch trình")
    name: cover
    widget: select
    options:
    - label: Biên Hòa – Trị An (Đồng Nai)
      value: Đồng Nai|Biên Hòa – Trị An
    - label: Buôn Ma Thuột (Đắk Lắk)
      value: Đắk Lắk|Buôn Ma Thuột
    - label: Bình Phước (Đồng Nai)
      value: Đồng Nai|Bình Phước
    - label: Bạc Liêu (Cà Mau)
      value: Cà Mau|Bạc Liêu
    - label: Bắc Giang (Bắc Ninh)
      value: Bắc Ninh|Bắc Giang
    - label: Bến Tre (Vĩnh Long)
      value: Vĩnh Long|Bến Tre
    - label: Châu Đốc – Núi Sam (An Giang)
      value: An Giang|Châu Đốc – Núi Sam
    - label: Cát Bà (Hải Phòng)
      value: Hải Phòng|Cát Bà
    - label: Cô Tô (Quảng Ninh)
      value: Quảng Ninh|Cô Tô
    - label: Côn Đảo (TP. Hồ Chí Minh)
      value: TP. Hồ Chí Minh|Côn Đảo
    - label: Cần Thơ
      value: Cần Thơ|Cần Thơ
    - label: Cố đô Huế (Huế)
      value: Huế|Cố đô Huế
    - label: Hà Giang – Đồng Văn (Tuyên Quang)
      value: Tuyên Quang|Hà Giang – Đồng Văn
    - label: Hà Nam (Ninh Bình)
      value: Ninh Bình|Hà Nam
    - label: Hà Tiên (An Giang)
      value: An Giang|Hà Tiên
    - label: Hà Tĩnh – Thiên Cầm (Hà Tĩnh)
      value: Hà Tĩnh|Hà Tĩnh – Thiên Cầm
    - label: Hạ Long (Quảng Ninh)
      value: Quảng Ninh|Hạ Long
    - label: Hải Dương (Hải Phòng)
      value: Hải Phòng|Hải Dương
    - label: Hồ Ba Bể (Thái Nguyên)
