    - label: Thành nhà Hồ – Pù Luông (Thanh Hóa)
      value: Thanh Hóa|Thành nhà Hồ – Pù Luông
    - label: Thác Bản Giốc – Trùng Khánh (Cao Bằng)
      value: Cao Bằng|Thác Bản Giốc – Trùng Khánh
    - label: Thái Bình (Hưng Yên)
      value: Hưng Yên|Thái Bình
    - label: Trung tâm Sài Gòn (TP. Hồ Chí Minh)
      value: TP. Hồ Chí Minh|Trung tâm Sài Gòn
    - label: Trung tâm Đà Nẵng (Đà Nẵng)
      value: Đà Nẵng|Trung tâm Đà Nẵng
    - label: Trà Vinh (Vĩnh Long)
      value: Vĩnh Long|Trà Vinh
    - label: Tràng An – Tam Cốc (Ninh Bình)
      value: Ninh Bình|Tràng An – Tam Cốc
    - label: Vinh – Cửa Lò (Nghệ An)
      value: Nghệ An|Vinh – Cửa Lò
    - label: Vĩnh Long
      value: Vĩnh Long|Vĩnh Long
    - label: Vũng Tàu (TP. Hồ Chí Minh)
      value: TP. Hồ Chí Minh|Vũng Tàu
    - label: Yên Tử (Quảng Ninh)
      value: Quảng Ninh|Yên Tử
    - label: Đà Lạt (Lâm Đồng)
      value: Lâm Đồng|Đà Lạt
    - label: Đắk Nông (Lâm Đồng)
      value: Lâm Đồng|Đắk Nông
    - label: Đền Hùng – Việt Trì (Phú Thọ)
      value: Phú Thọ|Đền Hùng – Việt Trì
    - label: Đồ Sơn (Hải Phòng)
      value: Hải Phòng|Đồ Sơn
    required: false
    hint: 'Chọn nơi bài viết nói tới: bài sẽ dùng ảnh có sẵn của nơi đó làm ảnh bìa và có nút "Lên lịch trình" mở thẳng trong app.'
  - label: Ảnh bìa riêng (không bắt buộc)
    name: cover_image
    widget: image
    required: false
    hint: Tải ảnh tự chụp nếu muốn thay ảnh có sẵn. Ảnh được tự thu nhỏ, nên chọn ảnh ngang. Chỉ dùng ảnh bạn có quyền sử dụng.
  - label: Thẻ (chủ đề)
    name: tags
    widget: list
    required: false
    hint: 'Ví dụ: Miền Nam, Biển, Lịch trình. Tối đa 6 thẻ.'
  - label: Mô tả ngắn
    name: excerpt
    widget: text
    required: false
    hint: 1–2 câu hiện dưới tiêu đề trên thẻ bài và trên Google (khoảng 150 ký tự). Để trống thì tự lấy đoạn đầu bài.
  - label: Bản nháp (chưa đăng)
    name: draft
    widget: boolean
    default: false
    required: false
    hint: Bật lên thì bài được lưu nhưng chưa hiện trên web.
  - label: Nội dung
    name: body
    widget: markdown
    hint: 'Dùng Heading 2 cho các mục lớn (Ngày 1, Ăn gì…), danh sách gạch đầu dòng cho các ý. Có thể chèn ảnh. Muốn chèn nút lịch trình giữa bài, gõ một dòng riêng: [[dest:Tỉnh|Điểm đến|Chữ trên nút]]'
